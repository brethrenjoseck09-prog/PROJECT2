<style>
   h1 {
    color: white;
    font-size: 40px;
    text-decoration: underline;
  }

  .container {
    position: relative;
    width: 400px;
    height: 400px;
    padding: 30px 40px;
    border: 1px solid;
    border-radius: 15px;
    text-align: center;
    background: transparent;
    backdrop-filter: blur(100px);
    justify-items:center ;
  }

  body {
    background: linear-gradient(to left, rgb(64, 64, 217), grey)
  }
  button {
    border: none;
    border-radius: 25px;
    font-size: 30px;
    background: rgb(255, 217, 0);
    text-decoration: none;
    margin: 100px;
    margin-bottom: 3px;
    width: 390px;
    height: 40px;
  }

  button :hover {
    font-size: 31px;
    font-family:Georgia, 'Times New Roman', Times, serif;
  }
  
  .input-box {
    margin: 40px 0 20px;
    width: 100%;
    height: 40%;
  }

  input {
    width: 50%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-size: 17px;
    text-indent: 8px;
    color: white;
    padding: 0 35px 0 5px;
    border-bottom: 2px solid;
  }
</style>
<body> 

  <div class="container">
    <form action="">
      <h1>LOGIN</h1>

      <div class="input-box">
        <input type="text" placeholder="Username" required>
      </div>

      <div class="input-box">
        <input type="text" placeholder="Password" required>
      </div>

      <button type="submit" class="btn"><a href="#">Login</a></button>
